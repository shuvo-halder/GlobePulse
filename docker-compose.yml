version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: devuser
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: globepulse
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devuser -d globepulse"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  auth-service:
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile
    ports:
      - "8081:8081"
    environment:
      APP_ENV: development
      PORT: 8081
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: devuser
      DB_PASS: devpassword
      DB_NAME: globepulse
      REDIS_ADDR: redis:6379
      REDIS_PASS: ""
      JWT_SECRET: supersecret
    depends_on:
      - postgres
      - redis

  news-service:
    build:
      context: ./services/news-service
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      APP_ENV: development
      PORT: 8080
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: devuser
      DB_PASS: devpassword
      DB_NAME: globepulse
      REDIS_ADDR: redis:6379
      REDIS_PASS: ""
    depends_on:
      - postgres
      - redis

  country-service:
    build:
      context: ./services/country-service
      dockerfile: Dockerfile
    ports:
      - "8082:8082"
    environment:
      APP_ENV: development
      PORT: 8082
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: devuser
      DB_PASS: devpassword
      DB_NAME: globepulse
      REDIS_ADDR: redis:6379
      REDIS_PASS: ""
    depends_on:
      - postgres
      - redis

  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 5

  analytics-service:
    build:
      context: ./services/analytics-service
      dockerfile: Dockerfile
    ports:
      - "8084:8084"
    environment:
      APP_ENV: development
      PORT: 8084
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: devuser
      DB_PASS: devpassword
      DB_NAME: globepulse
      REDIS_ADDR: redis:6379
      REDIS_PASS: ""
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
    depends_on:
      - postgres
      - redis
      - rabbitmq

  ai-service:
    build:
      context: ./services/ai-service
      dockerfile: Dockerfile
    ports:
      - "8083:8083"
    environment:
      APP_ENV: development
      PORT: 8083
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: devuser
      DB_PASS: devpassword
      DB_NAME: globepulse
      REDIS_ADDR: redis
      REDIS_PORT: 6379
      REDIS_PASS: ""
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:8083/health\")'"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      - postgres
      - redis
      - rabbitmq

  ai-worker:
    build:
      context: ./services/ai-service
      dockerfile: Dockerfile
    command: celery -A app.core.celery_app worker --loglevel=info -Q ai_analysis_queue
    environment:
      APP_ENV: development
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: devuser
      DB_PASS: devpassword
      DB_NAME: globepulse
      REDIS_ADDR: redis
      REDIS_PORT: 6379
      REDIS_PASS: ""
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
    depends_on:
      - postgres
      - redis
      - rabbitmq
      - ai-service

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    environment:
      APP_ENV: development
    depends_on:
      - auth-service
      - news-service
      - country-service
      - analytics-service

volumes:
  pgdata:
