x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-devuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpassword}
      POSTGRES_DB: ${POSTGRES_DB:-globepulse}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-devuser} -d ${POSTGRES_DB:-globepulse}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  auth-service:
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile
    image: globepulse-auth-service:latest
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "127.0.0.1:8081:8081"
    environment:
      APP_ENV: ${APP_ENV:-production}
      PORT: 8081
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-devuser}
      DB_PASS: ${POSTGRES_PASSWORD:-devpassword}
      DB_NAME: ${POSTGRES_DB:-globepulse}
      REDIS_ADDR: redis:6379
      REDIS_PASS: ""
      JWT_SECRET: ${JWT_SECRET:-supersecret}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8081/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  news-service:
    build:
      context: ./services/news-service
      dockerfile: Dockerfile
    image: globepulse-news-service:latest
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      APP_ENV: ${APP_ENV:-production}
      PORT: 8080
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-devuser}
      DB_PASS: ${POSTGRES_PASSWORD:-devpassword}
      DB_NAME: ${POSTGRES_DB:-globepulse}
      REDIS_ADDR: redis:6379
      REDIS_PASS: ""
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  country-service:
    build:
      context: ./services/country-service
      dockerfile: Dockerfile
    image: globepulse-country-service:latest
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "127.0.0.1:8082:8082"
    environment:
      APP_ENV: ${APP_ENV:-production}
      PORT: 8082
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-devuser}
      DB_PASS: ${POSTGRES_PASSWORD:-devpassword}
      DB_NAME: ${POSTGRES_DB:-globepulse}
      REDIS_ADDR: redis:6379
      REDIS_PASS: ""
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8082/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  rabbitmq:
    image: rabbitmq:3-management-alpine
    restart: unless-stopped
    logging: *default-logging
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-guest}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 5

  analytics-service:
    build:
      context: ./services/analytics-service
      dockerfile: Dockerfile
    image: globepulse-analytics-service:latest
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "127.0.0.1:8084:8084"
    environment:
      APP_ENV: ${APP_ENV:-production}
      PORT: 8084
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-devuser}
      DB_PASS: ${POSTGRES_PASSWORD:-devpassword}
      DB_NAME: ${POSTGRES_DB:-globepulse}
      REDIS_ADDR: redis:6379
      REDIS_PASS: ""
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://guest:guest@rabbitmq:5672/}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8084/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  ai-service:
    build:
      context: ./services/ai-service
      dockerfile: Dockerfile
    image: globepulse-ai-service:latest
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "127.0.0.1:8083:8083"
    environment:
      APP_ENV: ${APP_ENV:-production}
      PORT: 8083
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-devuser}
      DB_PASS: ${POSTGRES_PASSWORD:-devpassword}
      DB_NAME: ${POSTGRES_DB:-globepulse}
      REDIS_ADDR: redis
      REDIS_PORT: 6379
      REDIS_PASS: ""
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://guest:guest@rabbitmq:5672/}
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:8083/health\")'"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  ai-worker:
    image: globepulse-ai-service:latest
    restart: unless-stopped
    logging: *default-logging
    command: celery -A app.core.celery_app worker --loglevel=info -Q ai_analysis_queue
    environment:
      APP_ENV: ${APP_ENV:-production}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-devuser}
      DB_PASS: ${POSTGRES_PASSWORD:-devpassword}
      DB_NAME: ${POSTGRES_DB:-globepulse}
      REDIS_ADDR: redis
      REDIS_PORT: 6379
      REDIS_PASS: ""
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://guest:guest@rabbitmq:5672/}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      ai-service:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    image: globepulse-frontend:latest
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "127.0.0.1:3100:80"
    environment:
      APP_ENV: ${APP_ENV:-production}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
    depends_on:
      - auth-service
      - news-service
      - country-service
      - analytics-service

volumes:
  pgdata:
    name: globepulse_pgdata

networks:
  default:
    name: globepulse-net
